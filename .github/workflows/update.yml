name: Update

on:
  schedule:
    # Every 5 min on weekdays during Valve working hours (UTC), hourly otherwise as a safety net.
    - cron: "*/5 16-23 * * 1-5"
    - cron: "*/5 0-3 * * 2-6"
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download all archives and rebuild everything"
        type: boolean
        default: false

concurrency:
  group: cs2assets
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src
            package.json
            package-lock.json
            tsconfig.json
            data/manifestId.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: check
        run: node src/index.ts check ${{ inputs.force && '--force' || '' }}

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: work/tools
          key: source2viewer-${{ runner.os }}-v1

      - name: Update data, images and API
        id: update
        env:
          STEAM_USERNAME: ${{ secrets.USERNAME }}
          STEAM_PASSWORD: ${{ secrets.PASSWORD }}
          LANGUAGES: ${{ vars.LANGUAGES }}
        run: node src/index.ts update ${{ inputs.force && '--force' || '' }}

      - name: Commit data and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data images
          git diff --cached --quiet || git commit -m "chore(data): manifest ${{ steps.update.outputs.manifest }}"
          git push

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
